<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation Algorithm Simulator</title>
  <desc id="desc">Capa do Recommendation Lab, simulador didático de sistemas de recomendação</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="1260" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090909"/>
      <stop offset="0.55" stop-color="#161616"/>
      <stop offset="1" stop-color="#3b070b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff3440"/>
      <stop offset="1" stop-color="#b30710"/>
    </linearGradient>
    <filter id="shadow" x="710" y="30" width="530" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="1240" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1140" cy="40" r="185" fill="#e50914" opacity="0.12"/>
  <circle cx="1080" cy="350" r="160" fill="#ff3440" opacity="0.08"/>

  <text x="86" y="102" fill="#ff6570" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ALGORITMOS • PERSONALIZAÇÃO • DADOS</text>
  <text x="86" y="170" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Recommendation Lab</text>
  <text x="86" y="218" fill="#D9D9DE" font-family="Arial, Helvetica, sans-serif" font-size="24">Simulador didático de sistemas de recomendação</text>
  <text x="86" y="255" fill="#989AA2" font-family="Arial, Helvetica, sans-serif" font-size="16">Inspirado em princípios públicos descritos pela Netflix</text>

  <g>
    <rect x="86" y="283" width="122" height="34" rx="17" fill="#26272b"/>
    <text x="147" y="305" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">JAVASCRIPT</text>
    <rect x="218" y="283" width="100" height="34" rx="17" fill="#26272b"/>
    <text x="268" y="305" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">RANKING</text>
    <rect x="328" y="283" width="128" height="34" rx="17" fill="#26272b"/>
    <text x="392" y="305" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">EXPLAINABLE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="748" y="65" width="472" height="232" rx="28" fill="#101113" stroke="#3d3f45" stroke-width="2"/>
    <text x="785" y="101" fill="#A8ABB2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">COMPORTAMENTO → RANKING</text>
    <g transform="translate(785 126)">
      <rect width="92" height="122" rx="14" fill="url(#red)"/>
      <text x="46" y="67" text-anchor="middle" fill="#FFF" font-family="Arial" font-size="26" font-weight="700">S</text>
      <rect x="106" width="92" height="122" rx="14" fill="#173458"/>
      <text x="152" y="67" text-anchor="middle" fill="#FFF" font-family="Arial" font-size="23" font-weight="700">BM</text>
      <rect x="212" width="92" height="122" rx="14" fill="#5f071d"/>
      <text x="258" y="67" text-anchor="middle" fill="#FFF" font-family="Arial" font-size="22" font-weight="700">ST</text>
      <path d="M318 61H352" stroke="#e50914" stroke-width="5" stroke-linecap="round"/>
      <path d="M341 50L354 61L341 72" fill="none" stroke="#e50914" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="366" y="14" width="68" height="28" rx="10" fill="#26272b"/>
      <rect x="366" y="51" width="68" height="28" rx="10" fill="#26272b"/>
      <rect x="366" y="88" width="68" height="28" rx="10" fill="#26272b"/>
      <rect x="374" y="22" width="44" height="12" rx="6" fill="#ff3440"/>
      <rect x="374" y="59" width="34" height="12" rx="6" fill="#ff6570"/>
      <rect x="374" y="96" width="24" height="12" rx="6" fill="#b0b2b8"/>
    </g>
    <text x="785" y="274" fill="#A8ABB2" font-family="Arial, Helvetica, sans-serif" font-size="12">Sinais → similaridade → popularidade → recência → exploração</text>
  </g>
</svg>
